# OpenOCD configuration for Core.W tiles (STM32WBA55, ST-Link)
# Based on stm32wbx.cfg but with Cortex-M33 TAPID for WBA55

source [find interface/stlink.cfg]

# Use same transport/DAP approach as stm32wbx.cfg
source [find target/swj-dp.tcl]
source [find mem_helper.tcl]

transport select hla_swd

set CHIPNAME stm32wba55
set WORKAREASIZE 0x10000

# WBA55 is Cortex-M33 (different TAPID from WB's Cortex-M4)
set CPUTAPID 0x0be12477

# Override reset config — T_VCC may not be connected
reset_config none separate

# Reuse the stm32wbx target config with our overrides
source [find target/stm32wbx.cfg]
